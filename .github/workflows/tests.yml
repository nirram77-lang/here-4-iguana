# ═══════════════════════════════════════════════════════════════════════════
# I4IGUANA - Automated Testing Workflow
# Runs every hour and on every push
# Sends email alerts on failures
# ═══════════════════════════════════════════════════════════════════════════

name: 🧪 I4IGUANA Automated Tests

on:
  # Run on every push
  push:
    branches: [main]
  
  # Run on every pull request
  pull_request:
    branches: [main]
  
  # Run every hour
  schedule:
    - cron: '0 * * * *'  # Every hour at minute 0
  
  # Allow manual trigger
  workflow_dispatch:

env:
  APP_URL: https://i4iguana-app.vercel.app
  WEBSITE_URL: https://i4iguana.com
  ALERT_EMAIL: nir@i4iguana.com

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: Quick Health Check
  # ═══════════════════════════════════════════════════════════════════════════
  health-check:
    name: 🏥 Health Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 🌐 Check Website
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.WEBSITE_URL }})
          if [ "$response" != "200" ]; then
            echo "❌ Website returned $response"
            exit 1
          fi
          echo "✅ Website OK ($response)"
      
      - name: 📱 Check App
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.APP_URL }})
          if [ "$response" != "200" ]; then
            echo "❌ App returned $response"
            exit 1
          fi
          echo "✅ App OK ($response)"
      
      - name: 📄 Check App Pages
        run: |
          pages=("/app" "/terms" "/privacy" "/admin/login")
          for page in "${pages[@]}"; do
            response=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.APP_URL }}$page")
            if [ "$response" != "200" ]; then
              echo "❌ $page returned $response"
              exit 1
            fi
            echo "✅ $page OK ($response)"
          done

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: Build Test
  # ═══════════════════════════════════════════════════════════════════════════
  build-test:
    name: 🔨 Build Test
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔍 TypeScript Check
        run: npx tsc --noEmit
        continue-on-error: false
      
      - name: 🔨 Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3: Send Alert on Failure
  # ═══════════════════════════════════════════════════════════════════════════
  notify-failure:
    name: 📧 Send Alert
    runs-on: ubuntu-latest
    needs: [health-check, build-test]
    if: failure()
    
    steps:
      - name: 📧 Send Email Alert
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.sendgrid.net
          server_port: 587
          username: apikey
          password: ${{ secrets.SENDGRID_API_KEY }}
          subject: 🚨 I4IGUANA Test Failed - ${{ github.workflow }}
          to: ${{ env.ALERT_EMAIL }}
          from: I4IGUANA Tests <alerts@i4iguana.com>
          html_body: |
            <html>
            <body style="font-family: Arial; background: #0a1f1a; color: white; padding: 20px;">
              <div style="background: #dc2626; padding: 20px; border-radius: 10px;">
                <h1>🚨 I4IGUANA Test Alert</h1>
                <p>Automated tests have failed!</p>
              </div>
              
              <div style="margin-top: 20px;">
                <h2>Details:</h2>
                <ul>
                  <li><strong>Workflow:</strong> ${{ github.workflow }}</li>
                  <li><strong>Run:</strong> ${{ github.run_number }}</li>
                  <li><strong>Branch:</strong> ${{ github.ref_name }}</li>
                  <li><strong>Commit:</strong> ${{ github.sha }}</li>
                  <li><strong>Time:</strong> ${{ github.event.head_commit.timestamp }}</li>
                </ul>
              </div>
              
              <div style="margin-top: 20px;">
                <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 
                   style="background: #22c55e; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px;">
                  View Details →
                </a>
              </div>
              
              <div style="margin-top: 30px; color: #6b7280; font-size: 12px;">
                🦎 I4IGUANA Automated Testing System
              </div>
            </body>
            </html>

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4: Success Summary (only on success)
  # ═══════════════════════════════════════════════════════════════════════════
  success-summary:
    name: ✅ Success
    runs-on: ubuntu-latest
    needs: [health-check, build-test]
    if: success()
    
    steps:
      - name: ✅ All tests passed
        run: |
          echo "═══════════════════════════════════════════"
          echo "✅ All I4IGUANA tests passed!"
          echo "═══════════════════════════════════════════"
          echo "🌐 Website: OK"
          echo "📱 App: OK"
          echo "🔨 Build: OK"
          echo "═══════════════════════════════════════════"
