# ═══════════════════════════════════════════════════════════════════════════
# I4IGUANA - Automated Testing Workflow
# Runs every 6 hours and on every push
# Sends email reports on both success and failure
# ═══════════════════════════════════════════════════════════════════════════

name: 🦎 I4IGUANA Automated Tests

on:
  # Run on every push
  push:
    branches: [main]

  # Run every 6 hours
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours (00:00, 06:00, 12:00, 18:00)

  # Allow manual trigger
  workflow_dispatch:

env:
  APP_URL: https://i4iguana-app.vercel.app
  WEBSITE_URL: https://i4iguana.com
  ALERT_EMAIL: nir@i4iguana.com

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: Health Check - Check all URLs are working
  # ═══════════════════════════════════════════════════════════════════════════
  health-check:
    name: 🌐 Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Check Website (i4iguana.com)
        id: website
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.WEBSITE_URL }})
          echo "status=$response" >> $GITHUB_OUTPUT
          if [ "$response" != "200" ]; then
            echo "❌ Website returned $response"
            exit 1
          fi
          echo "✅ Website OK ($response)"

      - name: Check App (i4iguana-app.vercel.app)
        id: app
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.APP_URL }})
          echo "status=$response" >> $GITHUB_OUTPUT
          if [ "$response" != "200" ]; then
            echo "❌ App returned $response"
            exit 1
          fi
          echo "✅ App OK ($response)"

      - name: Check App Pages
        run: |
          echo "Checking critical pages..."
          pages=("/app" "/terms" "/privacy")
          for page in "${pages[@]}"; do
            response=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.APP_URL }}$page")
            if [ "$response" != "200" ]; then
              echo "❌ $page returned $response"
              exit 1
            fi
            echo "✅ $page OK ($response)"
          done

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: Build Test - Verify the app builds correctly
  # ═══════════════════════════════════════════════════════════════════════════
  build-test:
    name: 🔨 Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3: Send Report on Failure
  # ═══════════════════════════════════════════════════════════════════════════
  notify-failure:
    name: 📧 Failure Report
    runs-on: ubuntu-latest
    needs: [health-check, build-test]
    if: failure()

    steps:
      - name: Send Failure Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.sendgrid.net
          server_port: 587
          username: apikey
          password: ${{ secrets.SENDGRID_API_KEY }}
          subject: "❌ I4IGUANA Test FAILED - ${{ github.run_number }}"
          to: ${{ env.ALERT_EMAIL }}
          from: I4IGUANA Tests <alerts@i4iguana.com>
          html_body: |
            <!DOCTYPE html>
            <html>
            <head>
              <style>
                body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
                .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 10px; overflow: hidden; }
                .header { background: #dc2626; color: white; padding: 20px; text-align: center; }
                .header h1 { margin: 0; font-size: 24px; }
                .content { padding: 20px; }
                table { width: 100%; border-collapse: collapse; margin: 20px 0; }
                th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
                th { background: #f8f8f8; font-weight: bold; }
                .status-fail { color: #dc2626; font-weight: bold; }
                .status-pass { color: #22c55e; font-weight: bold; }
                .btn { display: inline-block; background: #22c55e; color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px; margin-top: 20px; }
                .footer { background: #f8f8f8; padding: 15px; text-align: center; color: #666; font-size: 12px; }
              </style>
            </head>
            <body>
              <div class="container">
                <div class="header">
                  <h1>❌ TEST FAILED</h1>
                  <p>I4IGUANA Automated Tests</p>
                </div>
                
                <div class="content">
                  <h2>Test Results</h2>
                  <table>
                    <tr>
                      <th>Test</th>
                      <th>Description</th>
                      <th>Status</th>
                    </tr>
                    <tr>
                      <td>🌐 Health Check</td>
                      <td>Website & App availability</td>
                      <td class="status-fail">❌ FAILED</td>
                    </tr>
                    <tr>
                      <td>🔨 Build Test</td>
                      <td>Application build process</td>
                      <td class="status-fail">❌ FAILED</td>
                    </tr>
                  </table>

                  <h2>Run Details</h2>
                  <table>
                    <tr>
                      <th>Property</th>
                      <th>Value</th>
                    </tr>
                    <tr>
                      <td>Run Number</td>
                      <td>#${{ github.run_number }}</td>
                    </tr>
                    <tr>
                      <td>Branch</td>
                      <td>${{ github.ref_name }}</td>
                    </tr>
                    <tr>
                      <td>Commit</td>
                      <td>${{ github.sha }}</td>
                    </tr>
                    <tr>
                      <td>Triggered By</td>
                      <td>${{ github.event_name }}</td>
                    </tr>
                  </table>

                  <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" class="btn">
                    View Full Details →
                  </a>
                </div>

                <div class="footer">
                  🦎 I4IGUANA Automated Testing System | Tests run every 6 hours
                </div>
              </div>
            </body>
            </html>

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4: Send Report on Success
  # ═══════════════════════════════════════════════════════════════════════════
  notify-success:
    name: 📧 Success Report
    runs-on: ubuntu-latest
    needs: [health-check, build-test]
    if: success()

    steps:
      - name: Send Success Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.sendgrid.net
          server_port: 587
          username: apikey
          password: ${{ secrets.SENDGRID_API_KEY }}
          subject: "✅ I4IGUANA Tests PASSED - ${{ github.run_number }}"
          to: ${{ env.ALERT_EMAIL }}
          from: I4IGUANA Tests <alerts@i4iguana.com>
          html_body: |
            <!DOCTYPE html>
            <html>
            <head>
              <style>
                body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
                .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 10px; overflow: hidden; }
                .header { background: #22c55e; color: white; padding: 20px; text-align: center; }
                .header h1 { margin: 0; font-size: 24px; }
                .content { padding: 20px; }
                table { width: 100%; border-collapse: collapse; margin: 20px 0; }
                th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
                th { background: #f8f8f8; font-weight: bold; }
                .status-pass { color: #22c55e; font-weight: bold; }
                .btn { display: inline-block; background: #22c55e; color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px; margin-top: 20px; }
                .footer { background: #f8f8f8; padding: 15px; text-align: center; color: #666; font-size: 12px; }
              </style>
            </head>
            <body>
              <div class="container">
                <div class="header">
                  <h1>✅ ALL TESTS PASSED</h1>
                  <p>I4IGUANA Automated Tests</p>
                </div>
                
                <div class="content">
                  <h2>Test Results</h2>
                  <table>
                    <tr>
                      <th>Test</th>
                      <th>Description</th>
                      <th>Status</th>
                    </tr>
                    <tr>
                      <td>🌐 Health Check</td>
                      <td>Website & App availability</td>
                      <td class="status-pass">✅ PASSED</td>
                    </tr>
                    <tr>
                      <td>🔨 Build Test</td>
                      <td>Application build process</td>
                      <td class="status-pass">✅ PASSED</td>
                    </tr>
                  </table>

                  <h2>What Was Tested</h2>
                  <table>
                    <tr>
                      <th>Check</th>
                      <th>URL / Action</th>
                    </tr>
                    <tr>
                      <td>Website</td>
                      <td>i4iguana.com</td>
                    </tr>
                    <tr>
                      <td>App Home</td>
                      <td>i4iguana-app.vercel.app</td>
                    </tr>
                    <tr>
                      <td>App Page</td>
                      <td>/app</td>
                    </tr>
                    <tr>
                      <td>Terms Page</td>
                      <td>/terms</td>
                    </tr>
                    <tr>
                      <td>Privacy Page</td>
                      <td>/privacy</td>
                    </tr>
                    <tr>
                      <td>Build</td>
                      <td>npm run build</td>
                    </tr>
                  </table>

                  <h2>Run Details</h2>
                  <table>
                    <tr>
                      <th>Property</th>
                      <th>Value</th>
                    </tr>
                    <tr>
                      <td>Run Number</td>
                      <td>#${{ github.run_number }}</td>
                    </tr>
                    <tr>
                      <td>Branch</td>
                      <td>${{ github.ref_name }}</td>
                    </tr>
                    <tr>
                      <td>Triggered By</td>
                      <td>${{ github.event_name }}</td>
                    </tr>
                  </table>

                  <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" class="btn">
                    View Full Details →
                  </a>
                </div>

                <div class="footer">
                  🦎 I4IGUANA Automated Testing System | Tests run every 6 hours
                </div>
              </div>
            </body>
            </html>
